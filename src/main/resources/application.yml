thread.count.dbapiexecutor: 50
executor:
  default:
    timeout: 10000
adaptor:
  otp:
    initiate: http://localhost:7007/adaptor/otp/initiate
    validate: http://localhost:7007/adaptor/otp/validate
otp:
  initiate:
    data:
      allCapital: true
      length: 8
      transport: SMS
      useLetter: true
      useNumber: true
      validityInSecond: 60
rest-template:
  connection-time-out: 60000
  read-time-out: 60000
  pool:
    # Maximum total connections across all routes (increased from default 25)
    max-total: 200
    # Maximum connections per route (increased from default 5)
    max-per-route: 50
    # Validate connections that have been idle for more than 2 seconds
    validate-after-inactivity: 2000
    # Evict connections idle for more than 30 seconds
    evict-idle-connections: 30
    # Maximum lifetime of a connection in seconds (prevents stale connections)
    connection-time-to-live: 60
    # Socket timeout for reading data
    socket-timeout: 60000
