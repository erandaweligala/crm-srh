############################ Server Port Configuration ###############################
server:
  port: 31481
  http:
    port: 7121
log:
  identifierKey: UUID
  isDebug: true
info:
  app:
    name: crm
    msName: crm-secure-request-handler
com:
  adl:
    dte:
      plugins:
        logging:
          enabled: false
          level: DEBUG
        rolling:
          policy: time
        alarming:
          enabled: false
        msstat:
          enabled: false
#############Access Management Cofig###################################################################
secret-key: CrMTemp&ecret
access:
  token-expire-time-millsec: 90000000
temp:
  token-expire-time-millsec: 90000000
jwt:
  idle:
    time:
      range:
        sec: 90000
  refresh:
    time:
      range:
        sec: 90000
user:
  inactive:
    days: 90

##################### Rest template configurations ######################################################
rest-template:
  read-time-out: 60000
  connection-time-out: 60000
##################### Redis configurations #############################################################
spring:
  redis:
    database: 0
    host: redis-service.redis.svc.cluster.local
    port: 80
    timeout: 60000
    jedis:
      pool:
        max-idle: 8
        min-idle: 0
  sleuth:
    sampler:
      probability: 1.0
    web:
      skip-pattern: (^cleanup.*|.+favicon.*)
  main:
    allow-bean-definition-overriding: true

###################### OTP Configurations #############################################
otp:
  initiate:
    data:
      length: 8
      useLetter: true
      useNumber: true
      allCapital: true
      transport: SMS
      validityInSecond: 60

